[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usim"
version = "0.1.0"
description = "USIM: User SIMulator - Two-agent RL training for user simulation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["reinforcement-learning", "user-simulation", "two-agent", "customer-service", "tau-bench"]
authors = [
  { name = "Simon Yu", email = "simon011130@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies (minimal, framework-agnostic)
dependencies = [
  "numpy>=1.24.0",
  "tqdm>=4.65.0",
  "weave",
]

[project.optional-dependencies]
# Slime backend dependencies
slime = [
  "transformers>=4.36.0",
  "aiohttp>=3.9.0",
]

# Tinker backend dependencies
tinker = [
  "transformers>=4.36.0",
  "tinker",
  "tinker_cookbook",
]

# tau2-bench integration
tau2 = [
  "pydantic>=2.0.0",
]

# Development dependencies
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "black>=23.0.0",
  "isort>=5.12.0",
  "mypy>=1.0.0",
  "pylint>=2.17.0",
]

# All optional dependencies
all = [
  "usim[slime,tinker,tau2]",
]

# Full development setup
full = [
  "usim[all,dev]",
  "wandb>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/orby-ai/usim"
Documentation = "https://github.com/orby-ai/usim#readme"
Issues = "https://github.com/orby-ai/usim/issues"
Source = "https://github.com/orby-ai/usim"

[project.scripts]
usim-slime-train = "usim.slime.rollout:main"

[tool.hatch.build.targets.wheel]
packages = ["usim"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.coverage.run]
source_pkgs = ["usim", "tests"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
