[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usim"
version = "0.1.0"
description = "SCOPE: Self-Play with Co-Evolving Users Prevents Simulator Collapse in Multi-Agent RL"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["reinforcement-learning", "user-simulation", "multi-agent", "simulator-collapse", "tau-bench"]
authors = [
  { name = "Simon Yu" },
  { name = "Nicholas Tomlin" },
  { name = "Marwa Abdulhai" },
  { name = "Ximing Lu" },
  { name = "Derek Chong" },
  { name = "Abe Hou" },
  { name = "Dilara Soylu" },
  { name = "Sergey Levine" },
  { name = "Christopher D. Manning" },
  { name = "Weiyan Shi" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Imported by the core package and the P4G environment.
dependencies = [
  "numpy>=1.24.0",
  "weave",
  "litellm>=1.65.0",
]

[project.optional-dependencies]
# Slime training backend: rollout functions, co-training loop, SGLang clients.
# Slime itself (and with it Ray, SGLang, Megatron bindings) is installed from
# the pinned submodule: pip install -e ./slime
slime = [
  "transformers>=4.51.0,<5.0.0",
  "aiohttp>=3.9.0",
  "requests>=2.28.0",
]

# Persuasion for Good: persona loading from the ConvoKit corpus in data/p4g/.
p4g = [
  "convokit",
]

# tau2-bench: packages the usim tau2 code imports directly. tau2-bench itself
# is not on PyPI; install the pinned submodule: pip install -e ./external/tau2-bench
tau2 = [
  "loguru>=0.7.0",
]

# CooperBench: Redis messaging and Modal sandboxes. CooperBench itself comes
# from the pinned submodule: pip install -e ./external/CooperBench
cooperbench = [
  "redis>=5.0.0",
  "modal",
]

# Optional upload of rollout trajectories to Docent (--docent-collection).
docent = [
  "docent-python>=0.1.0",
]

# scripts/diagnostics/measure_coverage.py (embedding + clustering).
diagnostics = [
  "sentence-transformers",
  "scikit-learn",
]

# Development dependencies
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
  "black>=23.0.0",
  "isort>=5.12.0",
  "mypy>=1.0.0",
  "pylint>=2.17.0",
]

# All optional dependencies
all = [
  "usim[slime,p4g,tau2,cooperbench,docent,diagnostics]",
]

# Full development setup
full = [
  "usim[all,dev]",
  "wandb>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/CHATS-lab/scope_usim"
Documentation = "https://github.com/CHATS-lab/scope_usim#readme"
Issues = "https://github.com/CHATS-lab/scope_usim/issues"
Source = "https://github.com/CHATS-lab/scope_usim"

[tool.hatch.build.targets.wheel]
packages = ["usim"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.coverage.run]
source_pkgs = ["usim", "tests"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
