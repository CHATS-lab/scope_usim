# Cloudflare Tunnel config. Deploy as /etc/cloudflared/config.yml on the Vultr
# box, after running `cloudflared tunnel create usim-study` and replacing the
# UUIDs below.
#
# Setup steps on the VPS:
#   1. curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
#   2. sudo dpkg -i cloudflared.deb
#   3. cloudflared tunnel login
#   4. cloudflared tunnel create usim-study
#   5. Put the resulting credentials JSON at /etc/cloudflared/usim-study.json
#   6. Copy this file to /etc/cloudflared/config.yml and edit the UUID + hostname
#   7. cloudflared tunnel route dns usim-study study.your-domain.com
#   8. sudo cloudflared service install
#   9. sudo systemctl enable --now cloudflared

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /etc/cloudflared/usim-study.json

ingress:
  # The frontend handles static assets + SSR. The Next.js config rewrites
  # /api/* to the backend, so we don't need a second ingress rule here.
  - hostname: study.your-domain.com
    service: http://127.0.0.1:3000
  - service: http_status:404
